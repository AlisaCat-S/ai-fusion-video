name: Publish Docker Images

on:
  push:
    branches: ['**']
    tags:
      - '[0-9]*'
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (leave empty for auto date tag)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # Stage 0: Compute image tag once
  # ==========================================
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.IMAGE_TAG }}
      owner_lc: ${{ steps.vars.outputs.OWNER_LC }}
    steps:
      - name: Compute variables
        id: vars
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "IMAGE_TAG=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "IMAGE_TAG=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "IMAGE_TAG=$(TZ=Asia/Shanghai date +%Y%m%d)" >> $GITHUB_OUTPUT
          fi

  # ==========================================
  # Stage 1: Build per architecture
  # ==========================================
  build:
    name: Build ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runner }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ai-fusion-video/pom.xml

      - name: Build backend JAR
        working-directory: ./ai-fusion-video
        run: |
          chmod +x mvnw
          ./mvnw package -DskipTests -B

      - name: Prepare backend Docker context
        working-directory: ./ai-fusion-video
        run: |
          JAR_PATH=$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.jar.original' | head -n 1)
          if [ -z "$JAR_PATH" ]; then
            echo "No packaged backend jar found"
            exit 1
          fi
          mkdir -p docker-build
          cp "$JAR_PATH" docker-build/app.jar

      - name: Prepare variables
        run: |
          echo "OWNER_LC=${{ needs.prepare.outputs.owner_lc }}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ needs.prepare.outputs.image_tag }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.8.0

      - name: Login to GHCR
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------- 后端 ----------
      - name: Build and push backend
        uses: docker/build-push-action@v6.10.0
        with:
          context: ./ai-fusion-video/docker-build
          platforms: linux/${{ matrix.platform.arch }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/ai-fusion-video:${{ env.IMAGE_TAG }}-${{ matrix.platform.arch }}
          cache-from: type=gha,scope=backend-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.platform.arch }}

      # ---------- 前端 ----------
      - name: Build and push frontend
        uses: docker/build-push-action@v6.10.0
        with:
          context: ./ai-fusion-video-web
          platforms: linux/${{ matrix.platform.arch }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/ai-fusion-video-web:${{ env.IMAGE_TAG }}-${{ matrix.platform.arch }}
          cache-from: type=gha,scope=frontend-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.platform.arch }}

  # ==========================================
  # Stage 2: Merge multi-arch manifest
  # ==========================================
  merge:
    name: Merge Manifests
    runs-on: ubuntu-latest
    needs: [prepare, build]

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.8.0

      - name: Prepare variables
        run: |
          echo "OWNER_LC=${{ needs.prepare.outputs.owner_lc }}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ needs.prepare.outputs.image_tag }}" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create backend multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ env.OWNER_LC }}/ai-fusion-video:${{ env.IMAGE_TAG }} \
            -t ghcr.io/${{ env.OWNER_LC }}/ai-fusion-video:latest \
            ghcr.io/${{ env.OWNER_LC }}/ai-fusion-video:${{ env.IMAGE_TAG }}-amd64 \
            ghcr.io/${{ env.OWNER_LC }}/ai-fusion-video:${{ env.IMAGE_TAG }}-arm64

      - name: Create frontend multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ env.OWNER_LC }}/ai-fusion-video-web:${{ env.IMAGE_TAG }} \
            -t ghcr.io/${{ env.OWNER_LC }}/ai-fusion-video-web:latest \
            ghcr.io/${{ env.OWNER_LC }}/ai-fusion-video-web:${{ env.IMAGE_TAG }}-amd64 \
            ghcr.io/${{ env.OWNER_LC }}/ai-fusion-video-web:${{ env.IMAGE_TAG }}-arm64
